micronaut:
  application:
    name: prometheus-mcp
  server:
    port: ${MICRONAUT_SERVER_PORT:8080}
  mcp:
    server:
      transport: HTTP
      info:
        name: prometheus-mcp
        version: 1.0.0
  http:
    client:
      read-timeout: 30s

prometheus:
  # Overridable via PROMETHEUS_BASE_URL. Inside the docker 'monitoring' network this is the
  # Prometheus service name; for a host run use http://localhost:9090.
  base-url: ${PROMETHEUS_BASE_URL:`http://prometheus:9090`}
  metrics:
    # Only metric names fully matching this regex become per-metric MCP tools.
    # Default targets the load-generator + JVM + host families; set PROM_METRICS_INCLUDE=.* for everything.
    include: ${PROM_METRICS_INCLUDE:`loadgen_.*|results_.*|jvm_.*|process_.*|http_server_.*|system_.*|node_.*|up`}
    # Metric names matching this regex are dropped (applied after include). Blank = nothing excluded.
    exclude: ${PROM_METRICS_EXCLUDE:}
    # Hard cap on per-metric tools, to avoid flooding the MCP client.
    max-tools: ${PROM_MAX_TOOLS:200}
